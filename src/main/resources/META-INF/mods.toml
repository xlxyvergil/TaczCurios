# This is an example mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml
# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.tcc]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.tcc]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.tcc]]
modId="curios"
mandatory=true
versionRange="[5.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.tcc]]
modId="taa"
mandatory=true
versionRange="[1.4.2,)"
ordering="AFTER"
side="BOTH"

[[dependencies.tcc]]
modId="attributeslib"
mandatory=true
versionRange="*"
ordering="AFTER"
side="BOTH"

[[dependencies.tcc]]
modId="irons_spellbooks"
mandatory=false
versionRange="*"
ordering="AFTER"
side="BOTH"

[[dependencies.tcc]]
modId="goetyrevelation"
mandatory=false
versionRange="*"
ordering="AFTER"
side="BOTH"

[[dependencies.tcc]]
modId="revelationfix"
mandatory=false
versionRange="*"
ordering="AFTER"
side="BOTH"

[[dependencies.tcc]]
modId="jei"
mandatory=false
versionRange="*"
ordering="AFTER"
side="CLIENT"