modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
${mod_description}
'''
authors="${mod_authors}"

# 可扩展枚举声明（用于追加自定义 Rarity 稀有度）
enumExtensions = "META-INF/enumextensions.json"

# Mixin 配置声明
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="required"
versionRange="[9.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="taa"
type="required"
versionRange="[1.4.3,)"
ordering="AFTER"
side="BOTH"

# TACZ（modId 仍为 tacz）：编译期与运行期均为硬依赖，事件与枪械类型判定都来自它的 API
[[dependencies.${mod_id}]]
modId="tacz"
type="required"
versionRange="[1.2.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="fusedcritical"
type="required"
versionRange="[1.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="irons_spellbooks"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="*"
ordering="AFTER"
side="CLIENT"
