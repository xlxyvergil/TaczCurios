curios_cf=6529130
# TaczAttributeAdd
taa_curse_version=8913754
# TACZ 1.21.1（ChloePrime 发行版，modId 仍为 tacz）
tacz_curse_version=8547439
# Apothic Attributes
attributeslib_curse_version=8502288
# Touhou Little Maid
touhou_maid_cf=8061852
# Apotheosis
apotheosis_cf=8826922
# Placebo
placebo_cf=8463693
# Iron's Spells 'n Spellbooks
irons_spells_cf=8680204
# Lootr
lootr_cf=8927571
